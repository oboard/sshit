name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: sshit-linux-x64
          - os: macos
            arch: arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            artifact: sshit-macos-arm64
          - os: macos
            arch: x64
            runner: macos-15
            goos: darwin
            goarch: amd64
            artifact: sshit-macos-x64
          - os: windows
            arch: x64
            runner: windows-latest
            goos: windows
            goarch: amd64
            artifact: sshit-windows-x64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Build frontend
        working-directory: web
        run: |
          npm i -g pnpm
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.artifact }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
